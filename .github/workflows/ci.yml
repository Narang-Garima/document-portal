name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install development dependencies
        run: pip install -e ".[dev]"

      - name: Run Ruff linting
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run unit tests
        run: pytest --cov=api --cov=src --cov-report=term-missing

  deepeval:
    needs: test
    runs-on: ubuntu-latest

    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install evaluation dependencies
        run: pip install -e ".[dev,eval]"

      - name: Run 10-case DeepEval suite
        if: ${{ env.GOOGLE_API_KEY != '' }}
        env:
          RUN_RAG_EVALS: "1"
          USE_GEMINI_MODEL: "1"
          GEMINI_MODEL_NAME: "gemini-2.5-flash"
        run: python scripts/run_deepeval.py

      - name: Skip DeepEval when key is unavailable
        if: ${{ env.GOOGLE_API_KEY == '' }}
        run: echo "DeepEval skipped because GOOGLE_API_KEY is not configured."