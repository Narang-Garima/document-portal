repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: detect-private-key
  - repo: local
    hooks:
      - id: pytest
        name: Run unit tests before commit
        entry: python -m pytest tests -q
        language: system
        pass_filenames: false
        always_run: true
      - id: deepeval
        name: Run DeepEval RAG suite before push
        entry: python scripts/run_deepeval.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
