[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "document-portal"
version = "0.1.0"
description = "A multi-format document ingestion and RAG portal built with FastAPI and LangChain."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "itsdangerous>=2.2,<3.0",
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "jinja2>=3.1,<4.0",
  "python-dotenv>=1.0,<2.0",
  "pyyaml>=6.0,<7.0",
  "langchain-core>=0.3,<1.0",
  "langchain-community>=0.3,<1.0",
  "langchain-text-splitters>=0.3,<1.0",
  "langchain-chroma>=0.2,<1.0",
  "langchain-huggingface>=0.1,<1.0",
  "langchain-openai>=0.2,<1.0",
  "langchain-google-genai>=2.0,<3.0",
  "langchain-anthropic>=0.3,<1.0",
  "langchain-cohere>=0.4,<1.0",
  "chromadb>=0.5,<2.0",
  "sentence-transformers>=3.0,<6.0",
  "rank-bm25>=0.2,<1.0",
  "pypdf>=5.0,<7.0",
  "docx2txt>=0.8,<1.0",
  "python-docx>=1.1,<2.0",
  "pandas>=2.2,<3.0",
  "openpyxl>=3.1,<4.0",
  "unstructured[xlsx]>=0.16,<1.0",
  "jq>=1.8,<2.0",
  "sqlalchemy>=2.0,<3.0",
  "pymupdf>=1.24,<2.0",
  "pdfplumber>=0.11,<1.0",
  "pillow>=10.0,<13.0",
  "google-genai>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10.0",
  "pytest-cov>=5.0,<8.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.9,<1.0",
  "pre-commit>=4.0,<5.0",
]
eval = [
  "deepeval>=2.0,<4.0",
]
pinecone = [
  "langchain-pinecone>=0.2,<1.0",
  "pinecone>=5.0,<9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["api", "exception", "logger", "src", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Loading .env before application imports is intentional because auth settings
# are resolved when their modules are imported. FastAPI also uses File(...)
# as the standard declaration for multipart request parameters.
"api/main.py" = ["E402", "B008"]
